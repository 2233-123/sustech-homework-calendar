<script>
(function () {
"use strict";
const NS = "http://www.w3.org/2000/svg";
const q = (id) => document.getElementById(id);
const mk = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) if (attrs[k] !== undefined) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
const mkt = (parent, attrs, str) => { const t = mk("text", attrs, parent); t.textContent = str; return t; };

/* ---------- 时间/缓动 ---------- */
const clamp01 = (v) => v < 0 ? 0 : v > 1 ? 1 : v;
const S = (t0, t1, t) => clamp01((t - t0) / (t1 - t0));
const lerp = (a, b, p) => a + (b - a) * p;
function bezier(x1, y1, x2, y2) {
  const A = (a, b) => 1 - 3 * b + 3 * a, B = (a, b) => 3 * b - 6 * a, C = (a) => 3 * a;
  const calc = (t, a, b) => ((A(a, b) * t + B(a, b)) * t + C(a)) * t;
  const slope = (t, a, b) => 3 * A(a, b) * t * t + 2 * B(a, b) * t + C(a);
  return (x) => { let t = x; for (let i = 0; i < 8; i++) { const s = slope(t, x1, x2); if (Math.abs(s) < 1e-6) break; t -= (calc(t, x1, x2) - x) / s; } return calc(t, y1, y2); };
}
const EO = bezier(0.22, 1, 0.36, 1), EIO = bezier(0.65, 0, 0.35, 1), EI = bezier(0.4, 0, 1, 1);
function spring(u) {
  if (u <= 0) return 0; if (u >= 1) return 1;

  const px = 1990 + (1370 - 1990) * pp + 640 * pe;
  R.setPanel.setAttribute("transform", `translate(${px.toFixed(2)} 150)`);
  R.setPanel.setAttribute("opacity", String(S(19.7, 20.05, t) * (1 - pe)));
  // 透明度滑块
  const opP = EIO(S(20.5, 21.0, t)) * (1 - EIO(S(21.0, 21.45, t)));
  const opV = lerp(95, 60, opP);
  const fOp = (opV / 100 - 0.3) / 0.7;
  R.opThumb.setAttribute("cx", String(28 + 340 * fOp));
  R.opFill.setAttribute("width", String(Math.max(0, 340 * fOp)));
  R.opVal.textContent = Math.round(opV) + "%";
  // 缩放滑块
  const scP = EIO(S(21.45, 21.95, t)) * (1 - EIO(S(21.95, 22.4, t)));
  const scV = lerp(100, 60, scP);
  const fSc = (scV - 40) / 110;
  R.scThumb.setAttribute("cx", String(28 + 250 * fSc));
  R.scFill.setAttribute("width", String(Math.max(0, 250 * fSc)));
  R.scVal.textContent = Math.round(scV) + "%（" + Math.round(408 * scV / 100) + "×" + Math.round(760 * scV / 100) + "）";
  // 右缘唤出条（窗口贴边后出现 → 轻摆 → 点击唤回）
  const etIn = S(22.75, 23.05, t), etOut = S(23.6, 23.9, t);
  const wig = t > 23.05 && t < 23.4 ? 3.2 * Math.sin((t - 23.05) / 0.35 * Math.PI * 4) * Math.exp(-(t - 23.05) * 4) : 0;
  const click = pulse(t, 23.3, 0.3);
  R.edgeTab.setAttribute("opacity", String(etIn * (1 - etOut)));
  R.edgeTab.setAttribute("transform", `translate(1920 540) scale(${(1 - 0.06 * click).toFixed(3)}) translate(-1920 -540) rotate(${wig.toFixed(2)} 1911 540)`);
  // 托盘图标 + 菜单（窗口归位后再入场，避免与滑回窗口叠影）
  const trIn = spring(S(23.7, 24.05, t));
  R.trayG.setAttribute("opacity", String(S(23.7, 23.95, t) * (1 - S(24.4, 24.6, t))));
  R.trayIcon.setAttribute("transform", `translate(1856 1012) scale(${(0.44 * (0.7 + 0.3 * trIn)).toFixed(4)}) translate(-50 -50)`);
  const mIn = S(23.8, 24.1, t), mOut = EI(S(24.35, 24.6, t));
  R.trayMenu.setAttribute("opacity", String(mIn * (1 - mOut)));
  [R.menuItem0, R.menuItem1, R.menuItem2].forEach((el, i) => {
    const pi = EO(S(23.8 + i * 0.12, 24.15 + i * 0.12, t));
    el.setAttribute("opacity", String(pi));
    el.setAttribute("transform", `translate(${((1 - pi) * 22).toFixed(2)} 0)`);
  });
  R.menuSep.setAttribute("opacity", String(EO(S(23.92, 24.27, t))));
  R.menuHi.setAttribute("opacity", String(S(24.1, 24.3, t) * (1 - S(24.4, 24.55, t))));
}

function s6Update(t) {
  const on = t >= 24.45;
  R.s6.style.display = on ? "" : "none";
  if (!on) return;
  CARDS.forEach((card, i) => {
    const t0 = 24.9 + i * 0.14;
    const sp = spring(S(t0, t0 + 0.55, t));
    const floatY = t > 26 ? 4 * Math.sin(2 * Math.PI * (t - t0) / 5.5 + i * 1.7) : 0;
    card.g.setAttribute("opacity", String(S(t0, t0 + 0.3, t)));
    card.g.setAttribute("transform", `translate(0 ${((1 - sp) * 70 + floatY).toFixed(2)})`);
  });
  const items = [
    { el: R.s6Logo, t0: 25.5 }, { el: R.s6Title, t0: 25.62 }, { el: R.s6Badge, t0: 25.74 },
    { el: R.s6Gh, t0: 25.86 }, { el: R.s6Tags, t0: 25.98 }, { el: R.s6Extra, t0: 26.08 },
  ];
  items.forEach(({ el, t0 }) => {
    const p = EO(S(t0, t0 + 0.7, t));
    el.setAttribute("opacity", String(p));
    if (el === R.s6Logo) el.setAttribute("transform", `translate(900 ${270 + (1 - p) * 36})`);
    else el.setAttribute("transform", `translate(0 ${((1 - p) * 36).toFixed(2)})`);
  });
  R.s6Glow.setAttribute("opacity", String(S(25.4, 26.2, t) * 0.9));
  R.s6.setAttribute("opacity", "1");
  R.fade.setAttribute("opacity", String(EIO(S(29.5, 30.0, t))));
}

/* ---------- 总帧函数 ---------- */
let lastT = 0;
function renderFrame(t) {
  lastT = Math.max(0, Math.min(30, Number(t) || 0));
  t = lastT;
  bgUpdate(t);
  windowUpdate(t);
  camUpdate(t);
  s3Update(t);
  s1Update(t);
  s4Update(t);
  s5Update(t);
  s6Update(t);
}
window.renderFrame = renderFrame;

/* ---------- 启动 ---------- */
renderFrame(new URLSearchParams(location.search).get("t") || 0);
(function fit() {
  const s = Math.min(innerWidth / 1920, innerHeight / 1080);
  q("stage").style.transform = `scale(${s})`;
})();
})();
</script>
</body>
