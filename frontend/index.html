<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>作业日程</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main id="app" class="widget">
    <header class="titlebar" id="titlebar">
      <span class="brand">作业日程</span>
      <span class="titlebar-actions">
        <button id="btn-edge-hide" class="icon-btn" title="收起至屏幕右侧">▸</button>
        <button id="btn-settings" class="icon-btn" title="设置">⚙</button>
      </span>
    </header>

    <div id="statusbar" class="statusbar">
      <span id="status-text">尚未同步</span>
      <button id="btn-status-sync" class="icon-btn small" title="立即同步">⟳</button>
    </div>

    <section id="login-card" class="card login-card" hidden>
      <h2>登录 SUSTech CAS</h2>
      <label class="field">学号
        <input id="login-sid" type="text" autocomplete="username" />
      </label>
      <label class="field">密码
        <input id="login-pwd" type="password" autocomplete="current-password" />
      </label>
      <label class="check">
        <input id="login-remember" type="checkbox" checked />
        记住账号（Windows 加密存储）
      </label>
      <div class="row">
        <button id="btn-login" class="btn primary">登录</button>
        <span id="login-msg" class="msg"></span>
      </div>
    </section>

    <nav class="month-nav">
      <button id="btn-prev" class="icon-btn" title="上个月">◀</button>
      <span id="month-label" class="month-label"></span>
      <button id="btn-next" class="icon-btn" title="下个月">▶</button>
      <button id="btn-today" class="btn ghost small">今天</button>
    </nav>

    <div class="weekhead">
      <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span>
    </div>
    <div id="calendar" class="calendar"></div>

    <section class="day-panel">
      <div class="day-head">
        <span id="day-label" class="day-label"></span>
        <button id="btn-add" class="btn primary small">＋ 添加日程</button>
      </div>
      <ul id="day-list" class="day-list"></ul>
      <div id="day-pager" class="day-pager" hidden>
        <button id="pager-prev" class="icon-btn small" title="上一页">◀</button>
        <span id="pager-dots" class="pager-dots"></span>
        <button id="pager-next" class="icon-btn small" title="下一页">▶</button>
      </div>
    </section>

    <div id="bubbles" class="bubbles"></div>

    <div id="modal-schedule" class="modal" hidden>
      <div class="modal-card">
        <h3 id="schedule-form-title">添加日程</h3>
        <form id="schedule-form">
          <label class="field">标题
            <input id="f-title" type="text" required />
          </label>
          <label class="check">
            <input id="f-all-day" type="checkbox" />
            全天
          </label>
          <label class="field">开始时间
            <input id="f-start" type="datetime-local" required />
          </label>
          <label class="field">结束时间
            <input id="f-end" type="datetime-local" />
          </label>
          <label class="field">提醒
            <select id="f-remind">
              <option value="">不提醒</option>
              <option value="300">提前 5 分钟</option>
              <option value="900">提前 15 分钟</option>
              <option value="1800">提前 30 分钟</option>
              <option value="3600">提前 1 小时</option>
              <option value="86400">提前 1 天</option>
            </select>
          </label>
          <label class="field">颜色
            <select id="f-color">
              <option value="">默认</option>
              <option value="#2563eb">蓝</option>
              <option value="#16a34a">绿</option>
              <option value="#ea580c">橙</option>
              <option value="#dc2626">红</option>
              <option value="#7c3aed">紫</option>
            </select>
          </label>
          <label class="field">备注
            <textarea id="f-note" rows="2"></textarea>
          </label>
          <div class="row">
            <button type="submit" class="btn primary">保存</button>
            <button type="button" id="btn-cancel-schedule" class="btn ghost">取消</button>
            <button type="button" id="btn-delete-schedule" class="btn danger" hidden>删除</button>
          </div>
          <span id="schedule-msg" class="msg"></span>
        </form>
      </div>
    </div>

    <div id="modal-settings" class="modal" hidden>
      <div class="modal-card">
        <h3>设置</h3>
        <section class="settings-group">
          <h4>BB 日程设置</h4>
          <label class="field">同步间隔（分钟）
            <input id="s-interval" type="number" min="1" />
          </label>
          <label class="check">
            <input id="s-bb-remind" type="checkbox" />
            开启 BB 作业截止提醒
          </label>
          <div id="bb-remind-detail" class="sub-block" hidden>
            <div class="remind-row">
              <span class="remind-label">提醒 1 · 截止前</span>
              <select id="s-remind1-days" class="mini"></select><span class="unit">天</span>
              <select id="s-remind1-hours" class="mini"></select><span class="unit">小时</span>
            </div>
            <div class="remind-row">
              <span class="remind-label">提醒 2 · 截止前</span>
              <select id="s-remind2-days" class="mini"></select><span class="unit">天</span>
              <select id="s-remind2-hours" class="mini"></select><span class="unit">小时</span>
            </div>
          </div>
        </section>
        <section class="settings-group">
          <h4>提醒</h4>
          <label class="field">提醒形式
            <select id="s-popup">
              <option value="inapp">应用内气泡</option>
              <option value="toast">系统通知</option>
              <option value="both">两者都要</option>
            </select>
          </label>
        </section>
        <section class="settings-group">
          <h4>窗口</h4>
          <label class="check">
            <input id="s-ontop" type="checkbox" />
            窗口置顶
          </label>
          <label class="field">窗口透明度
            <span class="slider-row">
              <input id="s-opacity" type="range" min="0.3" max="1" step="0.05" value="0.95" />
              <span id="s-opacity-val" class="slider-val" aria-hidden="true">95%</span>
            </span>
          </label>
          <label class="field">窗口缩放（40% – 150%）
            <span class="slider-row">
              <input id="s-scale" type="range" min="40" max="150" step="5" value="100" />
              <span id="s-scale-val" class="slider-val" aria-hidden="true">100%（408×760）</span>
            </span>
          </label>
          <label class="check">
            <input id="s-autostart" type="checkbox" />
            开机自启
          </label>
        </section>
        <section class="settings-group">
          <h4>账号</h4>
          <div class="row">
            <button id="btn-logout" class="btn ghost">退出登录</button>
          </div>
        </section>
        <div class="row">
          <button id="btn-save-settings" class="btn primary">保存</button>
          <button id="btn-close-settings" class="btn ghost">关闭</button>
          <span id="settings-msg" class="msg"></span>
        </div>
      </div>
    </div>

    <div id="modal-item" class="modal" hidden>
      <div class="modal-card">
        <h3 id="item-title"></h3>
        <dl id="item-fields" class="item-fields"></dl>
        <div class="row">
          <button id="btn-item-edit" class="btn primary" hidden>编辑</button>
          <button id="btn-item-open-bb" class="btn primary" hidden>在 Blackboard 中打开</button>
          <button id="btn-item-close" class="btn ghost">关闭</button>
        </div>
      </div>
    </div>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
